<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <button onclick="printGrades('Kareem')">Click</button>

    <script>
        let students = ['Khaled', 'Ahmed', 'Kareem', 'Reem', 'Lara']
        let marks_arabic = ['40', '32', '16', '39', '19']
        let marks_english = ['39', '35', '19', '36', '21']
        let marks_math= ['40', '33', '18', '36', '15']
        function printGrades(student) {
            var arrayIndex = students.indexOf(student);
            console.log(`${student} got ${marks_arabic[arrayIndex]} in Arabic, ${marks_math[arrayIndex]} in Math, and ${marks_english[arrayIndex]} in English`);
            }
    </script>
</body>
</html>
