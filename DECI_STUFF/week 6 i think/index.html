<!DOCTYPE html>
<html>
    <head>
        <title>Card Generator</title>
        <link href="class.css" rel="stylesheet">
    </head>
  <body style="background-color: grey;">
    <div class="container">
        <span id="name">I am X</span><br>
        <span id="age">I am X years old</span><br>
        <span id="hobbies">My hobbies are x, y, z</span><br>
        <button id="btn" class="btn">Click Me!</button>
        
    </div>
    <script>
        document.getElementById("btn").addEventListener("click", function() {
            document.getElementById("name").innerHTML = "I am " + prompt("Enter Your Name!");
            document.getElementById("hobbies").innerHTML = "My Hobbies are " + prompt("Enter Your hobbies!");
            let age = prompt("Enter Your Age!");
            if (isNaN(Number(age))) {
                alert("this isn't a number!");
                return;
            }
            document.getElementById("age").innerHTML = "I am " + age + " years old";
            document.getElementById("hobbies").innerHTML = "My Hobbies are " + prompt("Enter Your hobbies!");
        })
    </script>
  </body>
</html>
