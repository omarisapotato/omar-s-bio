<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskNester</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="taskForm" id="addTaskForm">
        <label for="addTaskTitle" class="form-label">Enter a task title...</label>
        <input type="text" class="form-control required-option" name="Title" id="addTaskTitle" placeholder="(e.g Send James an email)">
        <label for="addTaskDesc" class="form-label">Enter a task description...</label>
        <input type="text" class="form-control required-option" name="Description" id="addTaskDesc" placeholder="(e.g inform James about the new company schedule changes)">
        <label for="addTaskDate" class="form-label">Select the task due date...</label>
        <input type="date" class="form-control required-option" name="Date" id="addTaskDate">
        <label for="addTaskPriority" class="form-label">Select the task priority level...</label>
        <select class="form-select required-option" id="addTaskPriority">
            <option selected disabled value="">Open this select menu</option>
            <option value="1" style="background-color: #f8d7da; color: #842029;">High</option>
            <option value="2" style="background-color: #fff3cd; color: #664d03;">Normal</option>
            <option value="3" style="background-color: #d1e7dd; color: #0f5132;">Low</option>
        </select>
            <button class="btn btn-primary m-4" id="addTaskSubmit" disabled>Add Task</button>
    </div>
    <script src='./script.js'></script>
</body>
</html>
